# Server block for the Agent Desk web image. It replaces conf.d/default.conf of nginx-unprivileged, whose main
# nginx.conf already puts the pid file and every temp path under /tmp, so the root file system can be read-only.
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Vite file names carry a content hash, so they never change. A missing asset is a 404, not index.html: serving
  # HTML for a stale script URL would hide the real error.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
  }

  # The entry file must be revalidated on every load so a new release is picked up at once.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
  }

  # Everything else is a client-side route (or a small root file): serve the file if it exists, else the app shell.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri /index.html;
  }
}
