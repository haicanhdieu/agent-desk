version: '0.5'

# Started by `devbox run dev` (see docs/runbooks/local-dev.md).
# App config (ports, DB URLs, secrets) comes from .env, created from .env.example by `devbox run setup`.
# Ports below must match .env: api PORT=3000, web 5173 (Vite), postgres 54329, temporal 7233 / UI 8233.
#
# Start order: postgres + temporal -> migrate (one-shot) -> api + worker; web starts at once
# (its Vite proxy forwards /api, /auth, /webhooks, /dev to the api when it is up).

processes:
  postgres:
    command: docker-compose -f docker-compose.yml up postgres
    shutdown:
      command: docker-compose -f docker-compose.yml stop postgres
      timeout_seconds: 30
    readiness_probe:
      exec:
        command: docker-compose -f docker-compose.yml exec -T postgres pg_isready -U postgres
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 5
      # Room for the first image pull.
      failure_threshold: 100

  temporal:
    command: docker-compose -f docker-compose.yml up temporal
    shutdown:
      command: docker-compose -f docker-compose.yml stop temporal
      timeout_seconds: 30
    readiness_probe:
      exec:
        command: docker-compose -f docker-compose.yml exec -T temporal temporal operator cluster health --address localhost:7233
      initial_delay_seconds: 3
      period_seconds: 3
      timeout_seconds: 5
      failure_threshold: 100

  # One-shot: creates roles and applies Drizzle migrations (idempotent).
  migrate:
    command: pnpm --filter @agentdesk/api run migrate
    availability:
      restart: 'no'
      exit_on_end: false
    depends_on:
      postgres:
        condition: process_healthy

  api:
    command: pnpm --filter @agentdesk/api dev
    depends_on:
      postgres:
        condition: process_healthy
      temporal:
        condition: process_healthy
      migrate:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 3000
        path: /readyz
      initial_delay_seconds: 3
      period_seconds: 2
      timeout_seconds: 3
      failure_threshold: 60

  worker:
    command: pnpm --filter @agentdesk/worker dev
    depends_on:
      temporal:
        condition: process_healthy
      migrate:
        condition: process_completed_successfully

  web:
    # Pin IPv4: on macOS Vite's default `localhost` binds ::1 only, which the probe below can't reach.
    command: pnpm --filter @agentdesk/web dev --host 127.0.0.1 --port 5173 --strictPort
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 5173
        path: /
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 3
      failure_threshold: 30
